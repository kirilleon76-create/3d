<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D-каталог оборудования | AR/Web</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; overflow: hidden; background: #000; -webkit-user-select: none; user-select: none; }

    #intro { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
      z-index: 1000; display: flex; flex-direction: column; justify-content: center; 
      align-items: center; cursor: pointer; 
    }
    #logo { max-width: 400px; max-height: 200px; filter: drop-shadow(0 10px 30px rgba(0,0,0,0.3)); animation: logoAnim 2s ease-out; }
    #intro p { color: white; font-size: 1.4em; margin-top: 30px; animation: fadeIn 1s 1s both; text-align: center; }
    @keyframes logoAnim { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    #model-select { 
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
      background: rgba(0,0,0,0.95); backdrop-filter: blur(20px); 
      padding: 40px; border-radius: 20px; z-index: 999; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.5); 
      display: none; max-width: 90vw; max-height: 80vh; overflow-y: auto;
    }
    #model-list { list-style: none; margin: 20px 0; padding: 0; }
    #model-list li { 
      background: rgba(255,255,255,0.1); margin: 10px 0; padding: 15px; border-radius: 12px; 
      cursor: pointer; transition: all 0.3s; backdrop-filter: blur(10px); touch-action: manipulation;
      font-size: 16px; color: white;
    }
    #model-list li:hover, #model-list li:active { background: rgba(255,255,255,0.2); transform: translateX(10px); }

    #password-screen { 
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
      background: rgba(0,0,0,0.98); padding: 40px; border-radius: 20px; z-index: 1001; 
      text-align: center; display: none; backdrop-filter: blur(20px); box-shadow: 0 20px 60px rgba(0,0,0,0.8); 
      max-width: 90vw;
    }
    #password-input { 
      padding: 15px 20px; font-size: 18px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.3); 
      background: rgba(255,255,255,0.1); color: white; width: 250px; max-width: 80vw; 
      margin: 20px auto; display: block; outline: none; 
      -webkit-appearance: none; -webkit-user-select: text; ime-mode: active;
      font-family: inherit;
    }
    #password-input::placeholder { color: rgba(255,255,255,0.6); }
    .btn { 
      background: linear-gradient(45deg, #667eea, #764ba2); color: white; border: none; 
      padding: 15px 35px; border-radius: 25px; cursor: pointer; font-size: 16px; margin: 10px; 
      touch-action: manipulation; transition: all 0.2s; font-weight: 500; min-width: 160px;
      -webkit-appearance: none;
    }
    .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
    .btn:active { transform: translateY(0); }
    .btn-secondary { background: rgba(255,255,255,0.2); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    #viewer-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; }
    #ui { position: absolute; top: 20px; right: 20px; z-index: 100; display: flex; flex-direction: column; gap: 12px; }
    #ui button { 
      background: rgba(255,255,255,0.95); border: none; padding: 14px 22px; border-radius: 25px; 
      cursor: pointer; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.3); 
      touch-action: manipulation; transition: all 0.2s; font-weight: 500; min-width: 70px;
    }
    #ui button:hover:not(:disabled), #ui button:active:not(:disabled) { background: white; transform: translateY(-2px); }
    #ui button.active { background: #4CAF50; color: white; }
    #model-info { 
      position: absolute; bottom: 25px; left: 25px; color: white; z-index: 100; 
      background: rgba(0,0,0,0.8); padding: 20px; border-radius: 15px; max-width: 300px; 
      backdrop-filter: blur(10px);
    }

    #ar-instructions { 
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; 
      text-align: center; z-index: 101; display: none; backdrop-filter: blur(20px); 
      pointer-events: none; max-width: 80%; flex-direction: column; justify-content: center; gap: 10px;
    }
    .hit-indicator { 
      position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); 
      width: 120px; height: 120px; border: 4px solid #00ff88; border-radius: 50%; 
      display: none; animation: pulse 1s infinite; box-shadow: 0 0 30px #00ff88; 
    }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: translateX(-50%) scale(1); } 50% { opacity: 0.4; transform: translateX(-50%) scale(1.3); } }

    #loading { 
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
      color: white; z-index: 1002; display: none; text-align: center; 
    }
    .spinner { 
      border: 5px solid rgba(255,255,255,0.3); border-top: 5px solid white; 
      border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; 
      margin: 0 auto 25px; 
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .error-overlay { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: rgba(0,0,0,0.9); z-index: 2000; display: none; 
      justify-content: center; align-items: center; color: white; text-align: center;
    }
  </style>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="intro">
    <img src="logo.png" alt="Компания" id="logo">
    <p>Добро пожаловать в 3D-каталог<br><small>Нажмите для продолжения</small></p>
  </div>

  <div id="model-select">
    <h2>Выберите модель</h2>
    <ul id="model-list"></ul>
  </div>

  <div id="password-screen">
    <h3 id="model-title">Модель 1</h3>
    <input type="text" id="password-input" placeholder="Введите пароль" autocomplete="new-password">
    <br>
    <button class="btn" id="btn-open">Открыть модель</button>
    <button class="btn btn-secondary" id="btn-back">Назад</button>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <p id="loading-text">Загрузка модели...</p>
  </div>

  <div id="viewer-container">
    <div id="ui">
      <button id="btn-3d" class="active">🖥️ 3D</button>
      <button id="btn-ar">🌐 AR</button>
      <button id="reset-view">🔄 Сброс</button>
      <button id="fullscreen">📱 Экран</button>
    </div>
    <div id="ar-instructions">
      <p>📱 Наведите камеру на ровную поверхность</p>
      <div class="hit-indicator" id="hit-indicator"></div>
      <p>👆 Касайтесь экрана для размещения</p>
    </div>
    <div id="model-info">
      <h3 id="current-model">Модель</h3>
      <p id="model-desc">Описание</p>
    </div>
  </div>

  <div id="error-overlay" class="error-overlay">
    <div style="padding: 40px; max-width: 400px;">
      <h3>Ошибка</h3>
      <p id="error-message"></p>
      <button class="btn" onclick="document.getElementById('error-overlay').style.display='none'">OK</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const MODELS = [
      { id: 1, name: 'Транспортер', file: 'model1.glb', password: '123', desc: 'Промышленный транспортер' },
      { id: 2, name: 'Станок CNC', file: 'model2.glb', password: '321', desc: 'Фрезерный станок' },
      { id: 3, name: 'Сварочный аппарат', file: 'model3.glb', password: '231', desc: 'Полуавтомат сварки' }
    ];

    let scene, camera, renderer, controls, reticle;
    let currentModel, loadedModelGroup = null;
    let isARMode = false;
    let animationId, arSession = null, arHitTestSource = null;
    let viewerReady = false;

    // DOM элементы
    const els = {
      intro: document.getElementById('intro'),
      modelSelect: document.getElementById('model-select'),
      passwordScreen: document.getElementById('password-screen'),
      viewerContainer: document.getElementById('viewer-container'),
      btnOpen: document.getElementById('btn-open'),
      btnBack: document.getElementById('btn-back'),
      passwordInput: document.getElementById('password-input'),
      modelList: document.getElementById('model-list'),
      modelTitle: document.getElementById('model-title'),
      currentModel: document.getElementById('current-model'),
      modelDesc: document.getElementById('model-desc'),
      arInstructions: document.getElementById('ar-instructions'),
      hitIndicator: document.getElementById('hit-indicator'),
      loading: document.getElementById('loading'),
      loadingText: document.getElementById('loading-text'),
      btn3d: document.getElementById('btn-3d'),
      btnAR: document.getElementById('btn-ar'),
      resetView: document.getElementById('reset-view'),
      fullscreen: document.getElementById('fullscreen'),
      errorOverlay: document.getElementById('error-overlay'),
      errorMessage: document.getElementById('error-message')
    };

    const showError = (message) => {
      els.errorMessage.textContent = message;
      els.errorOverlay.style.display = 'flex';
    };

    const initApp = () => {
      console.log('🚀 App init');
      populateModels();
      bindEvents();
    };

    const populateModels = () => {
      els.modelList.innerHTML = '';
      MODELS.forEach(model => {
        const li = document.createElement('li');
        li.textContent = model.name;
        li.onclick = () => selectModel(model);
        els.modelList.appendChild(li);
      });
    };

    const selectModel = (model) => {
      currentModel = model;
      els.modelTitle.textContent = model.name;
      els.modelSelect.style.display = 'none';
      els.passwordScreen.style.display = 'block';
      els.passwordInput.value = '';
      // Принудительный фокус для iOS с задержкой [web:6][web:10]
      setTimeout(() => {
        els.passwordInput.focus();
        els.passwordInput.click();
      }, 100);
    };

    const checkPassword = () => {
      const pass = els.passwordInput.value;
      if (pass === currentModel.password) {
        els.passwordScreen.style.display = 'none';
        els.viewerContainer.style.display = 'block';
        if (!viewerReady) initViewer();
        els.loading.style.display = 'block';
        loadModel(currentModel);
      } else {
        els.passwordInput.value = '';
        els.passwordInput.focus();
        alert('Неверный пароль!');
      }
    };

    const backToList = () => {
      cleanup();
      els.passwordScreen.style.display = 'none';
      els.modelSelect.style.display = 'block';
    };

    const bindEvents = () => {
      // Intro
      els.intro.onclick = () => {
        els.intro.style.display = 'none';
        els.modelSelect.style.display = 'block';
      };

      // Password - workaround для iOS Safari [web:1]
      els.passwordInput.oninput = (e) => {
        if (e.target.value.length === 1) {
          e.target.type = 'password';
        }
      };
      els.passwordInput.onfocus = (e) => {
        if (e.target.value.length === 0) {
          e.target.type = 'text'; // Начинаем с text для показа клавиатуры
        }
      };
      els.btnOpen.onclick = checkPassword;
      els.btnBack.onclick = backToList;
      els.passwordInput.onkeypress = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          checkPassword();
        }
      };

      // Model list
      els.modelList.onclick = (e) => {
        if (e.target.tagName === 'LI') {
          const model = MODELS.find(m => m.name === e.target.textContent);
          model && selectModel(model);
        }
      };
    };

    const initViewer = () => {
      console.log('🎮 Init viewer');
      
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x2288ee);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 100);
      
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      renderer.shadowMap.enabled = true;
      els.viewerContainer.appendChild(renderer.domElement);

      // Lights
      scene.add(new THREE.AmbientLight(0xffffff, 0.6));
      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.set(5, 10, 5);
      scene.add(dirLight);

      // Controls
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.target.set(0, 1, 0);
      camera.position.set(0, 2, 5);

      // Reticle
      const reticleGeo = new THREE.RingGeometry(0.1, 0.15, 16);
      const reticleMat = new THREE.MeshBasicMaterial({color: 0x00ff88, transparent: true, opacity: 0.8});
      reticle = new THREE.Mesh(reticleGeo, reticleMat);
      reticle.visible = false;
      scene.add(reticle);

      // UI
      els.btn3d.onclick = () => switchTo3D();
      els.btnAR.onclick = () => switchToAR();
      els.resetView.onclick = resetView;
      els.fullscreen.onclick = () => {
        if (document.fullscreenElement) {
          document.exitFullscreen();
        } else {
          document.documentElement.requestFullscreen().catch(() => {});
        }
      };

      window.onresize = () => {
        if (camera && renderer) {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        }
      };

      renderer.domElement.ontouchstart = handleARPlacement;
      
      animate();
      viewerReady = true;
    };

    const loadModel = (model) => {
      els.loadingText.textContent = 'Загрузка ' + model.name;
      
      const loader = new GLTFLoader();
      loader.load(model.file, (gltf) => {
        if (loadedModelGroup) {
          scene.remove(loadedModelGroup);
          disposeObject(loadedModelGroup);
        }
        
        loadedModelGroup = gltf.scene;
        loadedModelGroup.scale.set(0.8, 0.8, 0.8);
        scene.add(loadedModelGroup);
        
        els.currentModel.textContent = model.name;
        els.modelDesc.textContent = model.desc;
        els.loading.style.display = 'none';
        resetView();
      }, undefined, (err) => {
        els.loading.style.display = 'none';
        showError('Не удалось загрузить модель: ' + model.file);
      });
    };

    const switchToAR = async () => {
      try {
        if (!navigator.xr) {
          showError('AR не поддерживается вашим браузером');
          return;
        }

        arSession = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['hit-test']
        });
        
        if (arSession) {
          isARMode = true;
          els.btn3d.classList.remove('active');
          els.btnAR.classList.add('active');
          els.arInstructions.style.display = 'flex';
          controls.enabled = false;
          renderer.xr.setSession(arSession);
          
          const refSpace = await arSession.requestReferenceSpace('viewer');
          arHitTestSource = await arSession.requestHitTestSource({ space: refSpace });
        }
      } catch (e) {
        showError('AR недоступно: ' + e.message);
      }
    };

    const switchTo3D = () => {
      isARMode = false;
      els.btnAR.classList.remove('active');
      els.btn3d.classList.add('active');
      els.arInstructions.style.display = 'none';
      controls.enabled = true;
      
      if (arSession) {
        arSession.end();
        arSession = null;
      }
      if (renderer.xr.getSession()) {
        renderer.xr.getSession().end();
      }
    };

    let lastTouch = { x: 0, y: 0 };
    const handleARPlacement = (event) => {
      if (!isARMode || !arHitTestSource) return;
      
      event.preventDefault();
      const rect = renderer.domElement.getBoundingClientRect();
      const x = ((event.touches ? event.touches[0].clientX : event.clientX) - rect.left) / rect.width * 2 - 1;
      const y = -((event.touches ? event.touches[0].clientY : event.clientY) - rect.top) / rect.height * 2 + 1;
      
      if (loadedModelGroup) {
        loadedModelGroup.position.set(x * 2, y * 2, -3);
      }
    };

    const resetView = () => {
      if (controls && !isARMode) {
        controls.reset();
        camera.position.set(0, 2, 5);
      }
    };

    const disposeObject = (obj) => {
      if (!obj) return;
      obj.traverse((child) => {
        if (child.geometry) child.geometry.dispose();
        if (child.material) {
          if (Array.isArray(child.material)) {
            child.material.forEach(m => m.dispose());
          } else {
            child.material.dispose();
          }
        }
      });
    };

    const cleanup = () => {
      if (animationId) cancelAnimationFrame(animationId);
      if (arSession) arSession.end();
      disposeObject(loadedModelGroup);
      loadedModelGroup = null;
      isARMode = false;
    };

    const animate = () => {
      animationId = requestAnimationFrame(animate);
      
      if (controls && !isARMode) controls.update();
      
      if (renderer) renderer.render(scene, camera);
    };

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
