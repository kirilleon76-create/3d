<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D-каталог оборудования | Масштаб</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; overflow: hidden; background: #000; user-select: none; -webkit-user-select: none; }

    #intro { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
      z-index: 1000; display: flex; flex-direction: column; justify-content: center; 
      align-items: center; cursor: pointer; 
      pointer-events: auto; /* явно разрешаем клики */
    }
    #logo { max-width: 300px; max-height: 150px; filter: drop-shadow(0 10px 30px rgba(0,0,0,0.3)); animation: logoAnim 2s ease-out; }
    #intro p { color: white; font-size: 1.3em; margin-top: 20px; text-align: center; animation: fadeIn 1s 1s both; }
    @keyframes logoAnim { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    #model-select { 
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
      background: rgba(0,0,0,0.95); backdrop-filter: blur(20px); 
      padding: 30px; border-radius: 20px; z-index: 999; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.5); 
      display: none; max-width: 90vw; max-height: 80vh; overflow-y: auto;
      pointer-events: auto;
    }
    #model-list { list-style: none; margin: 0; padding: 0; }
    #model-list li { 
      background: rgba(255,255,255,0.1); margin: 12px 0; padding: 16px; border-radius: 12px; 
      cursor: pointer; transition: all 0.3s; backdrop-filter: blur(10px); 
      font-size: 16px; color: white; touch-action: manipulation;
    }
    #model-list li:hover, #model-list li:active { background: rgba(255,255,255,0.25); transform: translateX(8px); }

    #password-screen { 
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
      background: rgba(0,0,0,0.98); padding: 30px; border-radius: 20px; z-index: 1001; 
      text-align: center; display: none; backdrop-filter: blur(20px); 
      max-width: 90vw; pointer-events: auto;
    }
    #password-input { 
      padding: 14px 20px; font-size: 18px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.3); 
      background: rgba(255,255,255,0.1); color: white; width: 220px; margin: 20px auto; 
      display: block; outline: none; color-scheme: dark;
    }
    .btn { 
      background: linear-gradient(45deg, #667eea, #764ba2); color: white; border: none; 
      padding: 14px 30px; border-radius: 25px; cursor: pointer; font-size: 15px; margin: 8px; 
      font-weight: 500; min-width: 140px; transition: 0.2s; touch-action: manipulation;
    }
    .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    .btn-secondary { background: rgba(255,255,255,0.2); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #viewer-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 10; }
    #ui { position: absolute; top: 20px; right: 20px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
    #ui button { 
      background: rgba(255,255,255,0.9); border: none; padding: 10px 16px; border-radius: 20px; 
      cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      font-size: 13px; touch-action: manipulation;
    }
    #ui button:hover:not(:disabled) { background: white; transform: translateY(-1px); }
    #ui button.active { background: #4CAF50; color: white; }

    #model-info { 
      position: absolute; bottom: 25px; left: 25px; color: white; z-index: 50; /* снижено */
      background: rgba(0,0,0,0.75); padding: 16px; border-radius: 12px; backdrop-filter: blur(10px);
      max-width: 260px; pointer-events: none; /* не мешает кликам */
    }
    #scale-label { font-size: 12px; opacity: 0.9; margin-top: 6px; font-weight: bold; }

    #loading { 
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
      color: white; z-index: 1002; display: none; text-align: center; 
    }
    .spinner { 
      border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #fff; 
      border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 10px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="intro">
    <img src="logo.png" alt="Logo" id="logo">
    <p>3D-каталог оборудования<br><small>👆 Нажмите экран для входа</small></p>
  </div>

  <div id="model-select">
    <h2>Выберите модель</h2>
    <ul id="model-list"></ul>
  </div>

  <div id="password-screen">
    <h3 id="model-title"></h3>
    <input type="password" id="password-input" placeholder="Введите пароль">
    <button class="btn" id="btn-open">Открыть модель</button>
    <button class="btn btn-secondary" id="btn-back">Назад</button>
  </div>

  <div id="viewer-container">
    <div id="ui">
      <button id="btn-3d" class="active">🖥️ 3D</button>
      <button id="btn-ar">🌐 AR</button>
      <button id="reset-view">🔄 Сброс</button>
      <button id="scale-plus">➕ Масштаб +</button>
      <button id="scale-minus">➖ Масштаб −</button>
    </div>
    <div id="model-info">
      <h3 id="current-model"></h3>
      <p id="model-desc"></p>
      <p id="scale-label">Масштаб: 1.0×<br><small>👆 Pinch / колесико / кнопки</small></p>
    </div>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <p id="loading-text">Загрузка...</p>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const MODELS = [
      { id: 1, name: 'Транспортер', file: 'model1.glb', password: '123', desc: 'Промышленный транспортер' },
      { id: 2, name: 'Станок CNC', file: 'model2.glb', password: '321', desc: 'Фрезерный станок' },
      { id: 3, name: 'Сварочный аппарат', file: 'model3.glb', password: '231', desc: 'Полуавтомат сварки' }
    ];

    let scene, camera, renderer, controls;
    let loadedModelGroup = null;
    let currentModelData = null;
    let viewerInitialized = false;

    let modelScale = 1;
    const MIN_SCALE = 0.2;
    const MAX_SCALE = 3;
    const SCALE_STEP = 0.2;

    let lastTapTime = 0;
    let touchTimer = 0;

    const els = {
      intro: document.getElementById('intro'),
      modelSelect: document.getElementById('model-select'),
      passwordScreen: document.getElementById('password-screen'),
      viewerContainer: document.getElementById('viewer-container'),
      modelList: document.getElementById('model-list'),
      passwordInput: document.getElementById('password-input'),
      loading: document.getElementById('loading'),
      loadingText: document.getElementById('loading-text'),
      btnOpen: document.getElementById('btn-open'),
      btnBack: document.getElementById('btn-back'),
      btn3d: document.getElementById('btn-3d'),
      btnAR: document.getElementById('btn-ar'),
      resetView: document.getElementById('reset-view'),
      scalePlus: document.getElementById('scale-plus'),
      scaleMinus: document.getElementById('scale-minus'),
      scaleLabel: document.getElementById('scale-label'),
      currentModel: document.getElementById('current-model'),
      modelDesc: document.getElementById('model-desc')
    };

    function updateScaleLabel() {
      els.scaleLabel.innerHTML = 'Масштаб: <strong>' + modelScale.toFixed(1) + '×</strong><br><small>👆 Pinch / колесико / кнопки</small>';
    }

    function applyScaleToModel() {
      if (loadedModelGroup) {
        loadedModelGroup.scale.set(modelScale, modelScale, modelScale);
      }
      updateScaleLabel();
    }

    function scaleUp() {
      modelScale = Math.min(MAX_SCALE, modelScale + SCALE_STEP);
      applyScaleToModel();
    }

    function scaleDown() {
      modelScale = Math.max(MIN_SCALE, modelScale - SCALE_STEP);
      applyScaleToModel();
    }

    function resetModelScale() {
      modelScale = 1;
      applyScaleToModel();
    }

    function handleTouchStart(e) {
      const now = Date.now();
      if (now - lastTapTime < 300) { // двойной тап
        e.preventDefault();
        resetModelScale();
        return;
      }
      lastTapTime = now;
    }

    // Инициализация приложения
    function init() {
      // Интро - клик по всему экрану
      els.intro.addEventListener('click', (e) => {
        e.preventDefault();
        els.intro.style.display = 'none';
        els.modelSelect.style.display = 'block';
      });
      els.intro.addEventListener('touchstart', (e) => {
        e.preventDefault();
        els.intro.style.display = 'none';
        els.modelSelect.style.display = 'block';
      });

      // Список моделей
      MODELS.forEach(m => {
        const li = document.createElement('li');
        li.textContent = m.name;
        li.addEventListener('click', () => selectModel(m));
        els.modelList.appendChild(li);
      });

      // Пароль
      els.btnOpen.addEventListener('click', verifyPassword);
      els.btnBack.addEventListener('click', () => {
        els.passwordScreen.style.display = 'none';
        els.modelSelect.style.display = 'block';
      });
      els.passwordInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') verifyPassword();
      });

      // Кнопки UI
      els.scalePlus.addEventListener('click', scaleUp);
      els.scaleMinus.addEventListener('click', scaleDown);
      els.resetView.addEventListener('click', () => {
        if (controls) controls.reset();
        camera.position.set(0, 2, 5);
        resetModelScale();
        if (loadedModelGroup) {
          loadedModelGroup.rotation.set(0,0,0);
          loadedModelGroup.position.set(0,0,0);
        }
      });

      els.btn3d.addEventListener('click', () => {
        els.btn3d.classList.add('active');
        els.btnAR.classList.remove('active');
      });

      updateScaleLabel();
    }

    function selectModel(model) {
      currentModelData = model;
      document.getElementById('model-title').textContent = model.name;
      els.modelSelect.style.display = 'none';
      els.passwordScreen.style.display = 'block';
      els.passwordInput.value = '';
      els.passwordInput.focus();
    }

    function verifyPassword() {
      if (els.passwordInput.value === currentModelData.password) {
        els.passwordScreen.style.display = 'none';
        startViewer();
      } else {
        alert('Неверный пароль');
        els.passwordInput.value = '';
        els.passwordInput.focus();
      }
    }

    function startViewer() {
      els.viewerContainer.style.display = 'block';
      if (!viewerInitialized) initThree();
      modelScale = 1;
      resetModelScale();
      loadGLB(currentModelData.file);
      els.currentModel.textContent = currentModelData.name;
      els.modelDesc.textContent = currentModelData.desc;
    }

    function initThree() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x222222);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 2, 5);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.xr.enabled = true;
      els.viewerContainer.appendChild(renderer.domElement);

      // Освещение
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
      dirLight.position.set(5, 5, 5);
      scene.add(dirLight);

      // OrbitControls с мобильными жестами
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.enableZoom = true;  // pinch-to-zoom
      controls.zoomSpeed = 0.8;
      controls.maxDistance = 20;
      controls.minDistance = 1;

      // Мобильные жесты
      renderer.domElement.addEventListener('touchstart', handleTouchStart, { passive: false });

      // Цикл рендера
      renderer.setAnimationLoop(() => {
        if (controls) controls.update();
        renderer.render(scene, camera);
      });

      // Resize
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      viewerInitialized = true;
    }

    function loadGLB(path) {
      els.loading.style.display = 'block';
      els.loadingText.textContent = 'Загрузка...';

      if (loadedModelGroup) {
        scene.remove(loadedModelGroup);
        loadedModelGroup = null;
      }

      const loader = new GLTFLoader();
      loader.load(path, (gltf) => {
        loadedModelGroup = gltf.scene;
        
        // Центрирование
        const box = new THREE.Box3().setFromObject(loadedModelGroup);
        const center = box.getCenter(new THREE.Vector3());
        loadedModelGroup.position.sub(center);
        
        applyScaleToModel();
        scene.add(loadedModelGroup);
        els.loading.style.display = 'none';
      }, (xhr) => {
        if (xhr.total) {
          const percent = Math.round(xhr.loaded / xhr.total * 100);
          els.loadingText.textContent = `Загрузка: ${percent}%`;
        }
      }, (error) => {
        console.error(error);
        alert('Ошибка загрузки: ' + path);
        els.loading.style.display = 'none';
      });
    }

    // Запуск
    init();
  </script>
</body>
</html>
