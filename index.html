<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D-каталог оборудования | AR/Web</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, Arial, sans-serif; overflow: hidden; background: #000; }

    /* Лого + выбор */
    #intro { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    #logo { max-width: 400px; max-height: 200px; filter: drop-shadow(0 10px 30px rgba(0,0,0,0.3)); animation: logoAnim 2s ease-out; }
    #intro p { color: white; font-size: 1.4em; margin-top: 30px; animation: fadeIn 1s 1s both; }
    @keyframes logoAnim { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    #model-select { 
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
      background: rgba(0,0,0,0.95); backdrop-filter: blur(20px); 
      padding: 40px; border-radius: 20px; z-index: 999; text-align: center; 
      box-shadow: 0 20px 60px rgba(0,0,0,0.5); display: none; 
    }
    #model-list { list-style: none; margin: 20px 0; }
    #model-list li { 
      background: rgba(255,255,255,0.1); margin: 10px 0; padding: 15px; 
      border-radius: 12px; cursor: pointer; transition: all 0.3s; 
      backdrop-filter: blur(10px); 
    }
    #model-list li:hover, #model-list li:active { background: rgba(255,255,255,0.2); transform: translateX(10px); }

    /* Пароль */
    #password-screen { 
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
      background: rgba(0,0,0,0.98); padding: 40px; border-radius: 20px; z-index: 1001; 
      text-align: center; display: none; backdrop-filter: blur(20px); 
      box-shadow: 0 20px 60px rgba(0,0,0,0.8); 
    }
    #password-input { padding: 15px; font-size: 18px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: white; width: 250px; margin: 20px; }
    #password-input::placeholder { color: rgba(255,255,255,0.6); }
    .btn { background: linear-gradient(45deg, #667eea, #764ba2); color: white; border: none; padding: 12px 30px; border-radius: 25px; cursor: pointer; font-size: 16px; margin: 10px; touch-action: manipulation; }
    .btn-secondary { background: rgba(255,255,255,0.2); }

    /* Viewer */
    #viewer-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; }
    #ui { position: absolute; top: 20px; right: 20px; z-index: 100; display: flex; flex-direction: column; gap: 10px; }
    #ui button { background: rgba(255,255,255,0.95); border: none; padding: 12px 20px; border-radius: 25px; cursor: pointer; font-size: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); touch-action: manipulation; }
    #ui button:hover, #ui button:active { background: white; transform: translateY(-2px); }
    #model-info { position: absolute; bottom: 20px; left: 20px; color: white; z-index: 100; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 10px; max-width: 300px; }

    /* AR индикатор */
    #ar-instructions { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; text-align: center; z-index: 101; display: none; backdrop-filter: blur(10px); }
    .hit-indicator { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); width: 100px; height: 100px; border: 3px solid #00ff88; border-radius: 50%; display: none; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: translateX(-50%) scale(1); } 50% { opacity: 0.5; transform: translateX(-50%) scale(1.2); } }
  </style>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/" } }
  </script>
</head>
<body>
  <!-- Лого -->
  <div id="intro">
    <img src="logo.png" alt="Компания" id="logo">
    <p>Добро пожаловать в 3D-каталог</p>
  </div>

  <!-- Выбор модели -->
  <div id="model-select">
    <h2>Выберите модель</h2>
    <ul id="model-list"></ul>
  </div>

  <!-- Пароль -->
  <div id="password-screen">
    <h3 id="model-title">Модель 1</h3>
    <input type="password" id="password-input" placeholder="Введите пароль">
    <br>
    <button class="btn" id="btn-open">Открыть модель</button>
    <button class="btn btn-secondary" id="btn-back">Назад</button>
  </div>

  <!-- 3D/AR Viewer -->
  <div id="viewer-container">
    <div id="ui">
      <button id="ar-toggle">🌐 AR</button>
      <button id="web-toggle">🖥️ 3D</button>
      <button id="reset-view">🔄 Сброс</button>
      <button id="fullscreen">📱 Полный экран</button>
    </div>
    <div id="ar-instructions">
      <p>Наведите камеру на ровную поверхность</p>
      <div class="hit-indicator" id="hit-indicator"></div>
      <p>Касайтесь для размещения модели</p>
    </div>
    <div id="model-info">
      <h3 id="current-model">Модель</h3>
      <p id="model-desc">Описание</p>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { ARButton } from 'three/addons/webxr/ARButton.js';
    import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
    import { BoxLineGeometry } from 'three/addons/geometries/BoxLineGeometry.js';

    const MODELS = [
      { id: 1, name: 'Транспортер', file: 'model1.glb', password: '123', desc: 'Промышленный транспортер' },
      { id: 2, name: 'Станок CNC', file: 'model2.glb', password: '321', desc: 'Фрезерный станок' },
      { id: 3, name: 'Сварочный аппарат', file: 'model3.glb', password: '231', desc: 'Полуавтомат сварки' }
    ];

    let scene, camera, renderer, controls;
    let currentModel, loadedModelGroup = null;
    let isARMode = false;
    let reticle, hitTestSource = null, hitTestSourceRequested = false;
    let controller1, controller2, controllerGrip1, controllerGrip2;
    let controllerModelFactory;
    let animationId;

    const initApp = () => {
      initViewer();
      initEventListeners();
      showIntro();
      populateModelList();
    };

    const populateModelList = () => {
      const list = document.getElementById('model-list');
      list.innerHTML = '';
      MODELS.forEach(model => {
        const li = document.createElement('li');
        li.textContent = model.name;
        li.onclick = () => selectModel(model);
        list.appendChild(li);
      });
    };

    const selectModel = (model) => {
      currentModel = model;
      document.getElementById('model-title').textContent = model.name;
      document.getElementById('model-select').style.display = 'none';
      document.getElementById('password-screen').style.display = 'block';
      document.getElementById('password-input').value = '';
      document.getElementById('password-input').focus();
    };

    const checkPassword = () => {
      const input = document.getElementById('password-input').value.trim();
      if (input === currentModel.password) {
        document.getElementById('password-screen').style.display = 'none';
        document.getElementById('viewer-container').style.display = 'block';
        loadModel(currentModel);
      } else {
        alert('Неверный пароль!');
        document.getElementById('password-input').value = '';
        document.getElementById('password-input').focus();
      }
    };

    const backToSelect = () => {
      document.getElementById('password-screen').style.display = 'none';
      document.getElementById('model-select').style.display = 'block';
      document.getElementById('password-input').value = '';
      if (loadedModelGroup) {
        scene.remove(loadedModelGroup);
        loadedModelGroup = null;
      }
      exitAR();
    };

    const initEventListeners = () => {
      document.getElementById('btn-open').onclick = checkPassword;
      document.getElementById('btn-back').onclick = backToSelect;
      document.getElementById('password-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') checkPassword();
      });
      document.getElementById('ar-toggle').onclick = toggleAR;
      document.getElementById('web-toggle').onclick = () => { isARMode = false; renderer.xr.enabled = false; controls.enabled = true; document.getElementById('ar-instructions').style.display = 'none'; };
      document.getElementById('reset-view').onclick = resetView;
      document.getElementById('fullscreen').onclick = toggleFullscreen;
    };

    const initViewer = () => {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xdddddd); // Светлый фон для AR

      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      renderer.shadowMap.enabled = true;
      document.getElementById('viewer-container').appendChild(renderer.domElement);

      // Освещение
      const ambient = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambient);
      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.set(0, 10, 5);
      scene.add(dirLight);

      // Reticle для hit-test
      const reticleGeometry = new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2);
      const reticleMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff88, opacity: 0.7, transparent: true });
      reticle = new THREE.Mesh(reticleGeometry, reticleMaterial);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      // Контроллеры WebXR
      controllerModelFactory = new XRControllerModelFactory();
      controller1 = renderer.xr.getController(0);
      controller1.addEventListener('selectstart', onSelectStart);
      scene.add(controller1);
      controllerGrip1 = renderer.xr.getControllerGrip(0);
      controllerGrip1.add(controllerModelFactory.createControllerModel(controllerGrip1));
      scene.add(controllerGrip1);

      controller2 = renderer.xr.getController(1);
      controller2.addEventListener('selectstart', onSelectStart);
      scene.add(controller2);
      controllerGrip2 = renderer.xr.getControllerGrip(1);
      controllerGrip2.add(controllerModelFactory.createControllerModel(controllerGrip2));
      scene.add(controllerGrip2);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      window.addEventListener('resize', onWindowResize);
    };

    let selectedObject = null;
    const onSelectStart = (event) => {
      const controller = event.target;
      const intersections = getIntersections(controller);
      if (intersections.length > 0) {
        selectedObject = intersections[0].object;
        controller.attach(selectedObject);
        controller.userData.selected = selectedObject;
      }
    };

    const getIntersections = (controller) => {
      controller.updateMatrixWorld();
      const tempMatrix = new THREE.Matrix4();
      tempMatrix.identity().extractRotation(controller.matrixWorld);
      const raycaster = new THREE.Raycaster();
      raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
      raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
      return raycaster.intersectObjects([loadedModelGroup], true);
    };

    const initEventListeners(); // Вызов после initViewer

    const loadModel = (model) => {
      document.getElementById('current-model').textContent = model.name;
      document.getElementById('model-desc').textContent = model.desc;

      if (loadedModelGroup) {
        scene.remove(loadedModelGroup);
        loadedModelGroup.traverse((child) => {
          if (child.geometry) child.geometry.dispose();
          if (child.material) {
            if (Array.isArray(child.material
