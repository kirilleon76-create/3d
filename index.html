<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D-каталог оборудования | AR/Web</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; overflow: hidden; background: #000; -webkit-user-select: none; user-select: none; }

    #intro { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
      z-index: 1000; display: flex; flex-direction: column; justify-content: center; 
      align-items: center; cursor: pointer; 
    }
    #logo { max-width: 400px; max-height: 200px; filter: drop-shadow(0 10px 30px rgba(0,0,0,0.3)); animation: logoAnim 2s ease-out; }
    #intro p { color: white; font-size: 1.4em; margin-top: 30px; animation: fadeIn 1s 1s both; text-align: center; }
    @keyframes logoAnim { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    #model-select { 
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
      background: rgba(0,0,0,0.95); backdrop-filter: blur(20px); 
      padding: 40px; border-radius: 20px; z-index: 999; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.5); 
      display: none; max-width: 90vw; max-height: 80vh; overflow-y: auto;
    }
    #model-list { list-style: none; margin: 20px 0; padding: 0; }
    #model-list li { 
      background: rgba(255,255,255,0.1); margin: 10px 0; padding: 15px; border-radius: 12px; 
      cursor: pointer; transition: all 0.3s; backdrop-filter: blur(10px); touch-action: manipulation;
      font-size: 16px; color: white;
    }
    #model-list li:hover { background: rgba(255,255,255,0.2); transform: translateX(10px); }

    #password-screen { 
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
      background: rgba(0,0,0,0.98); padding: 40px; border-radius: 20px; z-index: 1001; 
      text-align: center; display: none; backdrop-filter: blur(20px); box-shadow: 0 20px 60px rgba(0,0,0,0.8); 
      max-width: 90vw;
    }
    #password-input { 
      padding: 15px 20px; font-size: 18px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.3); 
      background: rgba(255,255,255,0.1); color: white; width: 250px; max-width: 80vw; 
      margin: 20px auto; display: block; outline: none; color-scheme: dark;
    }
    .btn { 
      background: linear-gradient(45deg, #667eea, #764ba2); color: white; border: none; 
      padding: 15px 35px; border-radius: 25px; cursor: pointer; font-size: 16px; margin: 10px; 
      font-weight: 500; min-width: 160px; transition: 0.2s;
    }
    .btn-secondary { background: rgba(255,255,255,0.2); }

    #viewer-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 10; }
    #ui { position: absolute; top: 20px; right: 20px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
    #ui button { 
      background: rgba(255,255,255,0.9); border: none; padding: 10px 16px; border-radius: 20px; 
      cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      font-size: 13px;
    }
    #ui button.active { background: #4CAF50; color: white; }

    #model-info { 
      position: absolute; bottom: 25px; left: 25px; color: white; z-index: 100; 
      background: rgba(0,0,0,0.7); padding: 15px; border-radius: 12px; backdrop-filter: blur(5px);
      max-width: 260px;
    }

    #loading { 
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
      color: white; z-index: 1002; display: none; text-align: center; 
    }
    .spinner { 
      border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #fff; 
      border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 10px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    #safari-warning {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(40, 40, 40, 0.95); color: white; padding: 30px; border-radius: 20px;
      text-align: center; z-index: 1005; display: none; width: 85%; max-width: 400px;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="intro">
    <img src="logo.png" alt="Logo" id="logo">
    <p>3D-каталог оборудования<br><small>Нажмите для входа</small></p>
  </div>

  <div id="model-select">
    <h2>Выберите модель</h2>
    <ul id="model-list"></ul>
  </div>

  <div id="password-screen">
    <h3 id="model-title"></h3>
    <input type="password" id="password-input" placeholder="Пароль">
    <button class="btn" id="btn-open">Открыть</button>
    <button class="btn btn-secondary" id="btn-back">Назад</button>
  </div>

  <div id="safari-warning">
    <h3>Режим AR</h3>
    <p>AR (дополненная реальность) лучше всего работает в Safari на iOS.</p>
    <button class="btn" id="continue-3d">Продолжить (3D режим)</button>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <p id="loading-text">Загрузка...</p>
  </div>

  <div id="viewer-container">
    <div id="ui">
      <button id="btn-3d" class="active">🖥️ 3D</button>
      <button id="btn-ar">🌐 AR</button>
      <button id="reset-view">🔄 Сброс</button>
      <button id="scale-plus">➕ Масштаб +</button>
      <button id="scale-minus">➖ Масштаб −</button>
    </div>
    <div id="model-info">
      <h3 id="current-model"></h3>
      <p id="model-desc"></p>
      <p id="scale-label" style="font-size:12px;opacity:0.8;margin-top:6px;">Масштаб: 1.0×</p>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const MODELS = [
      { id: 1, name: 'Транспортер', file: 'model1.glb', password: '123', desc: 'Промышленный транспортер' },
      { id: 2, name: 'Станок CNC', file: 'model2.glb', password: '321', desc: 'Фрезерный станок' },
      { id: 3, name: 'Сварочный аппарат', file: 'model3.glb', password: '231', desc: 'Полуавтомат сварки' }
    ];

    let scene, camera, renderer, controls;
    let loadedModelGroup = null;
    let currentModelData = null;
    let viewerInitialized = false;

    let modelScale = 1;          // текущий масштаб
    const MIN_SCALE = 0.2;
    const MAX_SCALE = 3;
    const SCALE_STEP = 0.2;

    const els = {
      intro: document.getElementById('intro'),
      modelSelect: document.getElementById('model-select'),
      passwordScreen: document.getElementById('password-screen'),
      safariWarning: document.getElementById('safari-warning'),
      viewerContainer: document.getElementById('viewer-container'),
      modelList: document.getElementById('model-list'),
      passwordInput: document.getElementById('password-input'),
      loading: document.getElementById('loading'),
      loadingText: document.getElementById('loading-text'),
      btnOpen: document.getElementById('btn-open'),
      btnBack: document.getElementById('btn-back'),
      continue3d: document.getElementById('continue-3d'),
      btn3d: document.getElementById('btn-3d'),
      btnAR: document.getElementById('btn-ar'),
      resetView: document.getElementById('reset-view'),
      scalePlus: document.getElementById('scale-plus'),
      scaleMinus: document.getElementById('scale-minus'),
      scaleLabel: document.getElementById('scale-label')
    };

    function updateScaleLabel() {
      if (els.scaleLabel) {
        els.scaleLabel.textContent = 'Масштаб: ' + modelScale.toFixed(1) + '×';
      }
    }

    function applyScaleToModel() {
      if (loadedModelGroup) {
        loadedModelGroup.scale.set(modelScale, modelScale, modelScale); // стандартное масштабирование в three.js[web:2][web:3]
      }
      updateScaleLabel();
    }

    function scaleUp() {
      modelScale = Math.min(MAX_SCALE, modelScale + SCALE_STEP);
      applyScaleToModel();
    }

    function scaleDown() {
      modelScale = Math.max(MIN_SCALE, modelScale - SCALE_STEP);
      applyScaleToModel();
    }

    // 1. Инициализация списка
    function init() {
      MODELS.forEach(m => {
        const li = document.createElement('li');
        li.textContent = m.name;
        li.onclick = () => {
          currentModelData = m;
          document.getElementById('model-title').textContent = m.name;
          els.modelSelect.style.display = 'none';
          els.passwordScreen.style.display = 'block';
        };
        els.modelList.appendChild(li);
      });

      els.intro.onclick = () => {
        els.intro.style.display = 'none';
        els.modelSelect.style.display = 'block';
      };

      els.btnOpen.onclick = verifyPassword;
      els.btnBack.onclick = () => {
        els.passwordScreen.style.display = 'none';
        els.modelSelect.style.display = 'block';
      };
      
      els.continue3d.onclick = () => {
        els.safariWarning.style.display = 'none';
        startViewer();
      };

      // кнопки масштаба
      els.scalePlus.onclick = scaleUp;
      els.scaleMinus.onclick = scaleDown;
      updateScaleLabel();
    }

    // 2. Проверка пароля
    function verifyPassword() {
      if (!currentModelData) return;
      if (els.passwordInput.value === currentModelData.password) {
        els.passwordScreen.style.display = 'none';
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
        
        if (isIOS && !isSafari) {
          els.safariWarning.style.display = 'block';
        } else {
          startViewer();
        }
      } else {
        alert('Неверный пароль');
      }
    }

    // 3. Запуск вьюера
    function startViewer() {
      if (!currentModelData) return;
      els.viewerContainer.style.display = 'block';
      if (!viewerInitialized) initThree();
      modelScale = 1;
      updateScaleLabel();
      loadGLB(currentModelData.file);
      document.getElementById('current-model').textContent = currentModelData.name;
      document.getElementById('model-desc').textContent = currentModelData.desc;
    }

    // 4. Настройка Three.js
    function initThree() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x333333);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 2, 5);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.xr.enabled = true;
      els.viewerContainer.appendChild(renderer.domElement);

      const light = new THREE.AmbientLight(0xffffff, 1);
      scene.add(light);
      const dirLight = new THREE.DirectionalLight(0xffffff, 2);
      dirLight.position.set(5, 5, 5);
      scene.add(dirLight);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      renderer.setAnimationLoop(() => {          // корректный цикл рендера для 3D/AR[web:7]
        if (controls) controls.update();
        renderer.render(scene, camera);
      });

      els.btn3d.onclick = () => {
        els.btn3d.classList.add('active');
        els.btnAR.classList.remove('active');
        // здесь может быть логика выхода из AR
      };

      els.resetView.onclick = () => {
        if (controls) controls.reset();
        camera.position.set(0, 2, 5);
        if (loadedModelGroup) {
          loadedModelGroup.rotation.set(0,0,0);
          loadedModelGroup.position.set(0,0,0);
          modelScale = 1;
          applyScaleToModel();
        } else {
          updateScaleLabel();
        }
      };

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      viewerInitialized = true;
    }

    // 5. Загрузка модели
    function loadGLB(path) {
      els.loading.style.display = 'block';
      els.loadingText.textContent = 'Загрузка...';

      if (loadedModelGroup) {
        scene.remove(loadedModelGroup);
        loadedModelGroup = null;
      }

      const loader = new GLTFLoader();
      loader.load(
        path,
        (gltf) => {
          loadedModelGroup = gltf.scene;

          // Центрирование модели
          const box = new THREE.Box3().setFromObject(loadedModelGroup);
          const center = box.getCenter(new THREE.Vector3());
          loadedModelGroup.position.sub(center);

          // применяем текущий масштаб
          applyScaleToModel();

          scene.add(loadedModelGroup);
          els.loading.style.display = 'none';
        },
        (xhr) => {
          if (xhr.total) {
            const percent = Math.round(xhr.loaded / xhr.total * 100);
            els.loadingText.textContent = `Загрузка: ${percent}%`;
          }
        },
        (error) => {
          console.error(error);
          alert('Ошибка загрузки модели. Проверьте путь к файлу.');
          els.loading.style.display = 'none';
        }
      );
    }

    init();
  </script>
</body>
</html>
