<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D-каталог оборудования | Масштаб</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; overflow: hidden; background: #000; user-select: none; }

    #intro { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
      z-index: 1000; display: flex; flex-direction: column; justify-content: center; 
      align-items: center; cursor: pointer; 
    }
    #logo { max-width: 300px; max-height: 150px; filter: drop-shadow(0 10px 30px rgba(0,0,0,0.3)); animation: logoAnim 2s ease-out; }
    @keyframes logoAnim { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }

    #model-select { 
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
      background: rgba(0,0,0,0.95); backdrop-filter: blur(20px); 
      padding: 30px; border-radius: 20px; z-index: 999; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.5); 
      display: none; max-width: 90vw; max-height: 80vh; overflow-y: auto;
    }
    #model-list li { 
      background: rgba(255,255,255,0.1); margin: 12px 0; padding: 16px; border-radius: 12px; 
      cursor: pointer; transition: all 0.3s; backdrop-filter: blur(10px); 
      font-size: 16px; color: white;
    }
    #model-list li:hover { background: rgba(255,255,255,0.25); transform: translateX(8px); }

    #password-screen { 
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
      background: rgba(0,0,0,0.98); padding: 30px; border-radius: 20px; z-index: 1001; 
      text-align: center; display: none; backdrop-filter: blur(20px); 
      max-width: 90vw;
    }
    #password-input { 
      padding: 14px 20px; font-size: 18px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.3); 
      background: rgba(255,255,255,0.1); color: white; width: 220px; margin: 20px auto; 
      display: block; outline: none; color-scheme: dark;
    }
    .btn { 
      background: linear-gradient(45deg, #667eea, #764ba2); color: white; border: none; 
      padding: 14px 30px; border-radius: 25px; cursor: pointer; font-size: 15px; margin: 8px; 
      font-weight: 500; min-width: 140px; transition: 0.2s;
    }
    .btn-secondary { background: rgba(255,255,255,0.2); }

    #viewer-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 10; }
    #ui { position: absolute; top: 20px; right: 20px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
    #ui button { 
      background: rgba(255,255,255,0.9); border: none; padding: 10px 16px; border-radius: 20px; 
      cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      font-size: 13px; touch-action: manipulation;
    }
    #ui button.active { background: #4CAF50; color: white; }
    #ui button:disabled { opacity: 0.5; cursor: not-allowed; }

    #model-info { 
      position: absolute; bottom: 25px; left: 25px; color: white; z-index: 100; 
      background: rgba(0,0,0,0.75); padding: 16px; border-radius: 12px; backdrop-filter: blur(10px);
      max-width: 260px;
    }
    #scale-label { font-size: 12px; opacity: 0.9; margin-top: 6px; font-weight: bold; }

    #loading { 
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
      color: white; z-index: 1002; display: none; text-align: center; 
    }
    .spinner { 
      border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #fff; 
      border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 10px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="intro">
    <img src="logo.png" alt="Logo" id="logo">
    <p>3D-каталог оборудования<br><small>Нажмите для входа</small></p>
  </div>

  <div id="model-select">
    <h2>Выберите модель</h2>
    <ul id="model-list"></ul>
  </div>

  <div id="password-screen">
    <h3 id="model-title"></h3>
    <input type="password" id="password-input" placeholder="Пароль">
    <button class="btn" id="btn-open">Открыть</button>
    <button class="btn btn-secondary" id="btn-back">Назад</button>
  </div>

  <div id="viewer-container">
    <div id="ui">
      <button id="btn-3d" class="active">🖥️ 3D</button>
      <button id="btn-ar">🌐 AR</button>
      <button id="reset-view">🔄 Сброс</button>
      <button id="scale-plus">➕ Масштаб +</button>
      <button id="scale-minus">➖ Масштаб −</button>
    </div>
    <div id="model-info">
      <h3 id="current-model"></h3>
      <p id="model-desc"></p>
      <p id="scale-label">Масштаб: 1.0×<br><small>👆 Pinch / колесико / кнопки</small></p>
    </div>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <p id="loading-text">Загрузка...</p>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const MODELS = [
      { id: 1, name: 'Транспортер', file: 'model1.glb', password: '123', desc: 'Промышленный транспортер' },
      { id: 2, name: 'Станок CNC', file: 'model2.glb', password: '321', desc: 'Фрезерный станок' },
      { id: 3, name: 'Сварочный аппарат', file: 'model3.glb', password: '231', desc: 'Полуавтомат сварки' }
    ];

    let scene, camera, renderer, controls;
    let loadedModelGroup = null;
    let currentModelData = null;
    let viewerInitialized = false;

    let modelScale = 1;
    const MIN_SCALE = 0.2;
    const MAX_SCALE = 3;
    const SCALE_STEP = 0.2;

    let lastTapTime = 0;
    let touchTimer = 0;

    const els = {
      intro: document.getElementById('intro'),
      modelSelect: document.getElementById('model-select'),
      passwordScreen: document.getElementById('password-screen'),
      viewerContainer: document.getElementById('viewer-container'),
      modelList: document.getElementById('model-list'),
      passwordInput: document.getElementById('password-input'),
      loading: document.getElementById('loading'),
      loadingText: document.getElementById('loading-text'),
      btnOpen: document.getElementById('btn-open'),
      btnBack: document.getElementById('btn-back'),
      btn3d: document.getElementById('btn-3d'),
      btnAR: document.getElementById('btn-ar'),
      resetView: document.getElementById('reset-view'),
      scalePlus: document.getElementById('scale-plus'),
      scaleMinus: document.getElementById('scale-minus'),
      scaleLabel: document.getElementById('scale-label'),
      currentModel: document.getElementById('current-model'),
      modelDesc: document.getElementById('model-desc')
    };

    function updateScaleLabel() {
      els.scaleLabel.innerHTML = 'Масштаб: <strong>' + modelScale.toFixed(1) + '×</strong><br><small>👆 Pinch / колесико / кнопки</small>';
    }

    function applyScaleToModel() {
      if (loadedModelGroup) {
        loadedModelGroup.scale.set(modelScale, modelScale, modelScale);
      }
      updateScaleLabel();
    }

    function scaleUp() {
      modelScale = Math.min(MAX_SCALE, modelScale + SCALE_STEP);
      applyScaleToModel();
    }

    function scaleDown() {
      modelScale = Math.max(MIN_SCALE, modelScale - SCALE_STEP);
      applyScaleToModel();
    }

    function resetModelScale() {
      modelScale = 1;
      applyScaleToModel();
    }

    function handleTouchStart(e) {
      clearTimeout(touchTimer);
      const now = Date.now();
      if (now - lastTapTime < 300) { // двойной тап
        e.preventDefault();
        resetModelScale();
        return;
      }
      lastTapTime = now;
    }

    function handleTouchEnd(e) {
      touchTimer = setTimeout(() => {
        // долгое нажатие - показать подсказку
        console.log('Долгое нажатие: двойной тап для сброса масштаба');
      }, 500);
    }

    // Инициализация
    function init() {
      MODELS.forEach(m => {
        const li = document.createElement('li');
        li.textContent = m.name;
        li.onclick = () => selectModel(m);
        els.modelList.appendChild(li);
      });

      els.intro.onclick = () => {
        els.intro.style.display = 'none';
        els.modelSelect.style.display = 'block';
      };

      els.btnOpen.onclick = verifyPassword;
      els.btnBack.onclick = () => {
        els.passwordScreen.style.display = 'none';
        els.modelSelect.style.display = 'block';
      };

      els.scalePlus.onclick = scaleUp;
      els.scaleMinus.onclick = scaleDown;
      els.resetView.onclick = () => {

        camera.position.set(0, 2, 5);
        resetModelScale(
