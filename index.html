<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D-каталог оборудования | Защищённый доступ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, Arial, sans-serif; overflow: hidden; background: #000; }

    /* Лого */
    #intro { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    #logo { max-width: 400px; max-height: 200px; filter: drop-shadow(0 10px 30px rgba(0,0,0,0.3)); animation: logoAnim 2s ease-out; }
    #intro p { color: white; font-size: 1.4em; margin-top: 30px; animation: fadeIn 1s 1s both; }
    @keyframes logoAnim { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* Выбор модели */
    #model-select { 
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
      background: rgba(0,0,0,0.95); backdrop-filter: blur(20px); 
      padding: 40px; border-radius: 20px; z-index: 999; text-align: center; 
      box-shadow: 0 20px 60px rgba(0,0,0,0.5); display: none; 
    }
    #model-list { list-style: none; margin: 20px 0; }
    #model-list li { 
      background: rgba(255,255,255,0.1); margin: 10px 0; padding: 15px; 
      border-radius: 12px; cursor: pointer; transition: all 0.3s; 
      backdrop-filter: blur(10px); 
    }
    #model-list li:hover { background: rgba(255,255,255,0.2); transform: translateX(10px); }
    #model-select button { background: linear-gradient(45deg, #667eea, #764ba2); color: white; border: none; padding: 12px 30px; border-radius: 25px; cursor: pointer; font-size: 16px; margin: 10px; }

    /* Пароль */
    #password-screen { 
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
      background: rgba(0,0,0,0.98); padding: 40px; border-radius: 20px; z-index: 1001; 
      text-align: center; display: none; backdrop-filter: blur(20px); 
      box-shadow: 0 20px 60px rgba(0,0,0,0.8); 
    }
    #password-input { padding: 15px; font-size: 18px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: white; width: 250px; margin: 20px; }
    #password-input::placeholder { color: rgba(255,255,255,0.6); }

    /* Viewer */
    #viewer-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; }
    #ui { position: absolute; top: 20px; right: 20px; z-index: 100; display: flex; gap: 10px; }
    #ui button { background: rgba(255,255,255,0.95); border: none; padding: 12px 20px; border-radius: 25px; cursor: pointer; font-size: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    #ui button:hover { background: white; transform: translateY(-2px); }
    #model-info { position: absolute; bottom: 20px; left: 20px; color: white; z-index: 100; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 10px; }
  </style>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/" } }
  </script>
</head>
<body>
  <!-- Лого -->
  <div id="intro">
    <img src="logo.png" alt="Компания" id="logo">
    <p>Добро пожаловать в 3D-каталог</p>
  </div>

  <!-- Выбор модели -->
  <div id="model-select">
    <h2>Выберите модель</h2>
    <ul id="model-list"></ul>
    <button onclick="showViewer()">Далее</button>
  </div>

  <!-- Пароль -->
  <div id="password-screen">
    <h3 id="model-title">Модель 1</h3>
    <input type="password" id="password-input" placeholder="Введите пароль">
    <br>
    <button onclick="checkPassword()">Открыть модель</button>
    <button onclick="backToSelect()">Назад</button>
  </div>

  <!-- 3D Viewer -->
  <div id="viewer-container">
    <div id="ui">
      <button id="fullscreen">📱 Экран</button>
      <button id="reset">🔄 Сброс</button>
    </div>
    <div id="model-info">
      <h3 id="current-model">Модель</h3>
      <p id="model-desc">Описание</p>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // Конфиг моделей (пароли задавайте здесь)
    const MODELS = [
      { id: 1, name: 'Транспортер', file: 'model1.glb', password: '123', desc: 'Промышленный транспортер' },
      { id: 2, name: 'Станок CNC', file: 'model2.glb', password: '321', desc: 'Фрезерный станок' },
      { id: 3, name: 'Сварочный аппарат', file: 'model3.glb', password: '231', desc: 'Полуавтомат сварки' }
      // Добавляйте свои: { id: 4, name: '...', file: 'model4.glb', password: 'pass', desc: '...' }
    ];

    let scene, camera, renderer, controls, currentModel, loadedModelGroup = null;
    let animationId = null;

    // Инициализация
    function initApp() {
      initViewer();
      showIntro();
      populateModelList();
    }

    function populateModelList() {
      const list = document.getElementById('model-list');
      list.innerHTML = '';
      MODELS.forEach(model => {
        const li = document.createElement('li');
        li.textContent = model.name;
        li.onclick = () => selectModel(model);
        list.appendChild(li);
      });
    }

    function selectModel(model) {
      currentModel = model;
      document.getElementById('model-title').textContent = model.name;
      document.getElementById('model-select').style.display = 'none';
      document.getElementById('password-screen').style.display = 'block';
      document.getElementById('password-input').value = ''; // Очистка поля
    }

    function checkPassword() {
      const input = document.getElementById('password-input').value.trim();
      if (input === currentModel.password) {
        document.getElementById('password-screen').style.display = 'none';
        document.getElementById('viewer-container').style.display = 'block';
        loadModel(currentModel);
      } else {
        alert('Неверный пароль!');
        document.getElementById('password-input').value = '';
        document.getElementById('password-input').focus();
      }
    }

    function backToSelect() {
      document.getElementById('password-screen').style.display = 'none';
      document.getElementById('model-select').style.display = 'block';
      document.getElementById('password-input').value = '';
    }

    function initViewer() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0a1a);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 10000);
      camera.position.set(0, 2, 5);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      document.getElementById('viewer-container').appendChild(renderer.domElement);

      const ambient = new THREE.AmbientLight(0x404040, 0.4);
      scene.add(ambient);
      const dirLight = new THREE.DirectionalLight(0xffffff, 2);
      dirLight.position.set(5, 10, 5);
      scene.add(dirLight);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      window.addEventListener('resize', onWindowResize);

      document.getElementById('fullscreen').onclick = toggleFullscreen;
      document.getElementById('reset').onclick = () => controls.reset();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.();
      } else {
        document.exitFullscreen();
      }
    }

    function loadModel(model) {
      // Обновляем инфо
      document.getElementById('current-model').textContent = model.name;
      document.getElementById('model-desc').textContent = model.desc;

      // Очищаем предыдущую модель
      if (loadedModelGroup) {
        scene.remove(loadedModelGroup);
        loadedModelGroup.traverse((child) => {
          if (child.geometry) child.geometry.dispose();
          if (child.material) child.material.dispose();
        });
        loadedModelGroup = null;
      }

      const loader = new GLTFLoader();
      loader.load(
        model.file,
        (gltf) => {
          loadedModelGroup = gltf.scene;
          loadedModelGroup.scale.set(1, 1, 1); // НАСТРОЙТЕ масштаб под вашу модель (например, 0.01 для CAD)
          loadedModelGroup.position.set(0, 0, 0);
          scene.add(loadedModelGroup);
          console.log('Модель загружена:', model.name);
          if (!animationId) animate(); // Запуск анимации только если не запущена
        },
        (progress) => {
          console.log('Загрузка:', (progress.loaded / progress.total * 100) + '%');
        },
        (error) => {
          console.error('Ошибка загрузки модели:', error);
          alert('Ошибка загрузки модели: ' + model.file + '. Проверьте файл и консоль (F12).');
          // Fallback: тестовая геометрия
          const geometry = new THREE.BoxGeometry(1, 1, 1);
          const material = new THREE.MeshStandardMaterial({ color: 0xff0000 });
          loadedModelGroup = new THREE.Group();
          loadedModelGroup.add(new THREE.Mesh(geometry, material));
          scene.add(loadedModelGroup);
        }
      );
    }

    function showIntro() {
      setTimeout(() => {
        document.getElementById('intro').style.opacity = '0';
        setTimeout(() => {
          document.getElementById('intro').style.display = 'none';
          document.getElementById('model-select').style.display = 'block';
        }, 800);
      }, 3000);
    }

    function animate() {
      animationId = requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    initApp();
  </script>
</body>
</html>
